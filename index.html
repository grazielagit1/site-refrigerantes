<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="png" href="favicon.png">
    <title>Refrigerantes</title>
</head>
<body>
    <main>
        <div class="item ativo" style="--background: #EA3D41">
            <div class="title"> Morango </div>
            <img src="Morango-refrigerante-foregroundBlur.png" class="fruit" alt="">
            <img src="Morango-refrigerante.png" class="refri" alt="Refrigerante sabor morango">
        </div>

         <div class="item" style="--background: #2D5643">
            <div class="title"> Abacate </div>
            <img src="Abacate-refrigerante-foregroundBlur.png" class="fruit" alt="">
            <img src="Abacate-refrigerante.png" class="refri" alt="Refrigerante sabor abacate">
        </div>

         <div class="item" style="--background: #E7A043">
            <div class="title"> Laranja </div>
            <img src="Laranja-refrigerante-foregroundBlur.png" class="fruit" alt="">
            <img src="Laranja-refrigerante.png" class="refri" alt="Refrigerante sabor laranja">
        </div>

        <div class="setinha">
            <button id="prev" type="button" aria-label="Sabor anterior">‹</button>
            <button id="next" type="button" aria-label="Próximo sabor">›</button>
        </div>





    </main>
    
</body>

<script src="script.js" defer></script>
</html>
